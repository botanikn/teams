openapi: 3.0.3
info:
  title: Team Task API
  version: 1.0.0
  description: REST API для управления задачами внутри команд.
servers:
  - url: /
paths:
  /api/v1/register:
    post:
      summary: Регистрация пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        "201":
          description: Пользователь зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "400":
          $ref: '#/components/responses/BadRequest'
        "409":
          $ref: '#/components/responses/Conflict'
  /api/v1/login:
    post:
      summary: Вход и получение JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: JWT access token
          content:
            application/json:
              schema:
                type: object
                required: [token, token_type]
                properties:
                  token: { type: string }
                  token_type: { type: string, example: Bearer }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
  /health:
    get:
      summary: Проверка готовности приложения
      responses:
        "200":
          description: Приложение доступно
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /openapi.yaml:
    get:
      summary: Получить OpenAPI-спецификацию
      responses:
        "200":
          description: OpenAPI YAML
          content:
            application/yaml:
              schema:
                type: string
  /api/v1/teams:
    post:
      summary: Создать команду
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 150 }
      responses:
        "201":
          description: Команда создана, создатель назначен owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
    get:
      summary: Список команд пользователя
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Команды, в которых состоит пользователь
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
        "401":
          $ref: '#/components/responses/Unauthorized'
  /api/v1/teams/{id}/invite:
    post:
      summary: Пригласить участника по user_id
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, role]
              properties:
                user_id: { type: integer, format: int64, minimum: 1 }
                role: { type: string, enum: [member, admin] }
      responses:
        "204": { description: Участник добавлен }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
  /api/v1/teams/{id}/members/{user_id}:
    put:
      summary: Изменить роль участника (только owner)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { in: path, name: user_id, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [member, admin] }
      responses:
        "204": { description: Роль изменена }
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Удалить участника (owner/admin; owner команды защищен)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { in: path, name: user_id, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "204": { description: Участник удален }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
  /api/v1/tasks:
    post:
      summary: Создать задачу
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        "201":
          description: Задача создана вместе с записью истории
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    get:
      summary: Список задач команды
      description: Результат кэшируется в Redis на 5 минут с учетом команды и фильтров.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: team_id, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { in: query, name: status, schema: { type: string, enum: [todo, in_progress, done] } }
        - { in: query, name: assignee_id, schema: { type: integer, format: int64, minimum: 0 } }
        - { in: query, name: limit, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
        - { in: query, name: offset, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200":
          description: Задачи команды
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
  /api/v1/tasks/{id}:
    put:
      summary: Обновить задачу с optimistic locking
      description: Передавайте текущую version. assignee_id=0 снимает исполнителя.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        "200":
          description: Задача обновлена; версия увеличена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          description: Версия устарела или ресурс конфликтует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/tasks/{id}/history:
    get:
      summary: История изменений задачи
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "200":
          description: История изменений доступна участникам команды
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskHistory'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
  /api/v1/tasks/{id}/comments:
    get:
      summary: Список комментариев задачи
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "200":
          description: Комментарии задачи
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskComment'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
    post:
      summary: Добавить комментарий
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 10000 }
      responses:
        "201":
          description: Комментарий добавлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskComment'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
  /api/v1/teams/{team_id}/stats:
    get:
      summary: SQL-отчет команды
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: team_id, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "200":
          description: Статистика задач, исполнителей, сроков и комментариев
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamStats'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Некорректный запрос или тело
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Требуется действительный JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Недостаточно прав или нет членства в команде
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Ресурс конфликтует с существующими данными
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 8, maxLength: 72 }
        name: { type: string, minLength: 1, maxLength: 150 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    User:
      type: object
      required: [id, email, name, created_at]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        name: { type: string }
        created_at: { type: string, format: date-time }
    Team:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        owner_name: { type: string }
        created_at: { type: string, format: date-time }
    CreateTaskRequest:
      type: object
      required: [team_id, title]
      properties:
        team_id: { type: integer, format: int64, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, maxLength: 65535 }
        status: { type: string, enum: [todo, in_progress, done], default: todo }
        assignee_id: { type: integer, format: int64, minimum: 1, nullable: true }
    UpdateTaskRequest:
      type: object
      required: [version]
      minProperties: 2
      properties:
        version: { type: integer, format: int64, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, maxLength: 65535 }
        status: { type: string, enum: [todo, in_progress, done] }
        assignee_id: { type: integer, format: int64, minimum: 0, nullable: true }
    Task:
      type: object
      required: [id, team_id, title, description, status, created_by, created_at, updated_at, version]
      properties:
        id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [todo, in_progress, done] }
        created_by: { type: string, description: Имя создателя задачи }
        assignee_id: { type: integer, format: int64, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
        version: { type: integer, format: int64 }
    TaskHistory:
      type: object
      required: [id, task_id, changed_by, changes, created_at]
      properties:
        id: { type: integer, format: int64 }
        task_id: { type: integer, format: int64 }
        changed_by: { type: integer, format: int64 }
        changes: { type: object, description: Старые и новые значения изменённых полей }
        created_at: { type: string, format: date-time }
    TaskComment:
      type: object
      required: [id, task_id, user_id, content, created_at]
      properties:
        id: { type: integer, format: int64 }
        task_id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        content: { type: string }
        created_at: { type: string, format: date-time }
    TopAssignee:
      type: object
      required: [user_id, name, closed_tasks]
      properties:
        user_id: { type: integer, format: int64 }
        name: { type: string }
        closed_tasks: { type: integer, format: int64 }
    TaskCommentStat:
      type: object
      required: [task_id, comment_count]
      properties:
        task_id: { type: integer, format: int64 }
        comment_count: { type: integer, format: int64 }
    TeamStats:
      type: object
      required: [tasks_by_status, top_assignees, average_closure_seconds, comments_by_task, total_comments]
      properties:
        tasks_by_status:
          type: object
          additionalProperties: { type: integer, format: int64 }
        top_assignees:
          type: array
          items:
            $ref: '#/components/schemas/TopAssignee'
        average_closure_seconds: { type: number, format: double }
        comments_by_task:
          type: array
          items:
            $ref: '#/components/schemas/TaskCommentStat'
        total_comments: { type: integer, format: int64 }
